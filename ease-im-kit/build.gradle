plugins {
    id 'com.android.library'
    id("org.jetbrains.kotlin.android")
    id 'maven-publish'
}
//group = "com.hyphenate"//groupId

android {
    compileSdk 34
//    buildToolsVersion "29.0.3"


    defaultConfig {
        minSdk 21
        targetSdk 29

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    //自3.6.0开始需要java8的支持
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.hyphenate.easeui'
    lint {
        abortOnError false
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'

    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    // baidu
    compileOnly files('libs/BaiduLBS_Android.jar')
    implementation files('libs/pinyin4j-2.5.0.jar')

//  api project(':hyphenatechatsdk')
    api 'io.hyphenate:hyphenate-chat:4.10.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    api 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.2.0'
    testImplementation 'junit:junit:4.12'
    implementation "androidx.recyclerview:recyclerview:1.2.0-beta01"
    api 'com.github.bumptech.glide:glide:4.9.0'

//    api project(path: ':ImagePickerLib')
    api 'com.mx.imgpicker:MXImagePicker:1.0.canary'
    api 'com.gitee.zhangmengxiong:MXStarter:1.2.3'

    implementation("androidx.activity:activity:1.9.2")

}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.hyphenate'
            artifactId = 'easeui'
            version = '1.0.canary'

            afterEvaluate {
                from components.release
            }
        }
    }
}